<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fond vert foncé arrondi -->
  <rect width="100" height="100" rx="18" fill="#0a2318"/>

  <!-- Croissant de lune doré -->
  <path d="M 58 18
    A 28 28 0 1 0 58 72
    A 20 20 0 1 1 58 18 Z"
    fill="url(#gold)" />

  <!-- Arche islamique (mihrab) -->
  <path d="M 52 70 L 52 52
    C 52 44 56 38 62 34
    C 68 38 72 44 72 52
    L 72 70 Z"
    fill="#0a2318"/>
  <path d="M 54 70 L 54 52
    C 54 45 58 40 62 36
    C 66 40 70 45 70 52
    L 70 70"
    fill="none" stroke="url(#gold)" stroke-width="2"/>

  <!-- Dôme de l'arche -->
  <ellipse cx="62" cy="36" rx="4" ry="3" fill="url(#gold)" opacity="0.8"/>

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#c8a727"/>
      <stop offset="100%" stop-color="#9a7010"/>
    </linearGradient>
  </defs>
</svg>
