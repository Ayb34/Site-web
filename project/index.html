<body>
<canvas id="mandala-bg"></canvas>
<div id="root"></div>

<script>
(function() {
  const canvas = document.getElementById('mandala-bg');
  const ctx = canvas.getContext('2d');
  let W, H, raf;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  /* ── colour helpers ── */
  function gold(a)      { return `rgba(200,167,39,${a})`; }
  function green(r,g,b,a){ return `rgba(${r},${g},${b},${a})`; }

  /* ── petal ring ── */
  function petalRing(cx, cy, ringR, count, petalLen, alpha) {
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      const px = cx + Math.cos(a) * ringR;
      const py = cy + Math.sin(a) * ringR;

      const tip  = { x: cx + Math.cos(a) * (ringR + petalLen), y: cy + Math.sin(a) * (ringR + petalLen) };
      const perp = { x: Math.cos(a + Math.PI / 2), y: Math.sin(a + Math.PI / 2) };
      const w = petalLen * 0.38;

      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.bezierCurveTo(
        px + perp.x * w, py + perp.y * w,
        tip.x + perp.x * w * 0.5, tip.y + perp.y * w * 0.5,
        tip.x, tip.y
      );
      ctx.bezierCurveTo(
        tip.x - perp.x * w * 0.5, tip.y - perp.y * w * 0.5,
        px - perp.x * w, py - perp.y * w,
        px, py
      );
      ctx.fillStyle   = gold(alpha * 0.07);
      ctx.fill();
      ctx.strokeStyle = gold(alpha);
      ctx.lineWidth   = 0.8;
      ctx.stroke();
    }
  }

  /* ── dot ring ── */
  function dotRing(cx, cy, r, count, dotR, alpha) {
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, dotR, 0, Math.PI * 2);
      ctx.fillStyle = gold(alpha);
      ctx.fill();
    }
  }

  /* ── true zellige tessellation (octogons + 4-point "noeuds")
     Classic Moroccan pattern: octogons on a square grid, with star-of-eight
     emerging in the gaps between four neighbouring octogons.
     Each octogon has radius `s`; grid step is s*(1+√2). ── */
  function zelligeTile(s, alpha) {
    const step = s * (1 + Math.sqrt(2));
    const rOct = s;
    // octogon vertex angle offset so flat sides face axes
    const half = Math.PI / 8;

    ctx.strokeStyle = gold(alpha);
    ctx.lineWidth = 1;

    // We tile the area [-step, step] worth of cells around origin; caller clips.
    // Returns a draw fn taking a count of cells in each direction.
    return function drawCells(nx, ny) {
      for (let ix = -nx; ix <= nx; ix++) {
        for (let iy = -ny; iy <= ny; iy++) {
          const cx = ix * step;
          const cy = iy * step;

          // Octogon
          ctx.beginPath();
          for (let k = 0; k < 8; k++) {
            const a = half + (k / 8) * Math.PI * 2;
            const x = cx + Math.cos(a) * rOct;
            const y = cy + Math.sin(a) * rOct;
            if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fillStyle = gold(alpha * 0.05);
          ctx.fill();
          ctx.stroke();

          // 8-point star centred at the gap (offset by step/2, step/2)
          // Only draw once per gap by gating on ix/iy parity-free position.
          const sx = cx + step / 2;
          const sy = cy + step / 2;
          // Star of 8 = two squares overlapped, scaled to fit gap between octogons
          const rStarOuter = s * (Math.sqrt(2) - 1) * 1.0 + s * 0.0; // gap radius
          // Compute exact: between two adjacent octogons the gap has half-width
          // = step/2 - s*cos(half) ; that's the inradius of the small star.
          const rStarIn = step / 2 - rOct * Math.cos(half);
          const rStarOut = rStarIn / Math.cos(Math.PI / 8);

          ctx.beginPath();
          for (let k = 0; k < 16; k++) {
            const a = (k / 16) * Math.PI * 2;
            const r = k % 2 === 0 ? rStarOut : rStarIn * 0.55;
            const x = sx + Math.cos(a) * r;
            const y = sy + Math.sin(a) * r;
            if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fillStyle = gold(alpha * 0.10);
          ctx.fill();
          ctx.stroke();
        }
      }
    };
  }

  /* ── full zellige mandala (true tessellation, clipped to disc) ── */
  function mandala(cx, cy, R, rot, alpha) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);

    // Tile size — chosen so several rows fit inside R
    const s = R / 5.2;
    const step = s * (1 + Math.sqrt(2));
    const nx = Math.ceil(R / step) + 2;
    const ny = nx;

    const drawCells = zelligeTile(s, alpha * 0.85);
    drawCells(nx, ny);

    /* outer border rings */
    [1, 0.97, 0.93].forEach((f, i) => {
      ctx.beginPath();
      ctx.arc(0, 0, R * f, 0, Math.PI * 2);
      ctx.strokeStyle = gold(i === 0 ? alpha : alpha * 0.3);
      ctx.lineWidth   = i === 0 ? 2 : 0.6;
      ctx.stroke();
    });

    ctx.restore();
  }

  /* ── draw frame ── */
  function draw(t) {
    ctx.clearRect(0, 0, W, H);

    /* ── background gradient (darker greens) ── */
    const bg = ctx.createRadialGradient(W * 0.7, H * 0.35, 0, W * 0.5, H * 0.5, W * 0.9);
    bg.addColorStop(0,   '#082a16');
    bg.addColorStop(0.35,'#04180b');
    bg.addColorStop(1,   '#020805');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    /* ── zellige tile overlay ── */
    ctx.save();
    const TS = 64; // tile size
    ctx.globalAlpha = 1;
    for (let tx = -TS; tx < W + TS; tx += TS) {
      for (let ty = -TS; ty < H + TS; ty += TS) {
        ctx.save();
        ctx.translate(tx + TS/2, ty + TS/2);
        const S = TS / 2;

        // outer square rotated 45°
        ctx.beginPath();
        ctx.moveTo(0, -S * 0.96);
        ctx.lineTo(S * 0.96, 0);
        ctx.lineTo(0, S * 0.96);
        ctx.lineTo(-S * 0.96, 0);
        ctx.closePath();
        ctx.strokeStyle = 'rgba(200,167,39,0.055)';
        ctx.lineWidth = 0.7;
        ctx.stroke();

        // inner square axis-aligned
        const si = S * 0.55;
        ctx.beginPath();
        ctx.rect(-si, -si, si*2, si*2);
        ctx.strokeStyle = 'rgba(200,167,39,0.04)';
        ctx.lineWidth = 0.5;
        ctx.stroke();

        // 8-point star lines
        ctx.strokeStyle = 'rgba(200,167,39,0.06)';
        ctx.lineWidth = 0.5;
        for (let k = 0; k < 4; k++) {
          const a = k * Math.PI / 4;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * S * 0.3, Math.sin(a) * S * 0.3);
          ctx.lineTo(Math.cos(a) * S * 0.96, Math.sin(a) * S * 0.96);
          ctx.stroke();
        }

        // corner petals (small arc in each corner of the tile)
        ctx.strokeStyle = 'rgba(200,167,39,0.05)';
        ctx.lineWidth = 0.6;
        const corners = [[S,S],[-S,S],[-S,-S],[S,-S]];
        corners.forEach(([cx,cy]) => {
          ctx.beginPath();
          ctx.arc(cx, cy, S * 0.52, 0, Math.PI * 2);
          ctx.stroke();
        });

        ctx.restore();
      }
    }
    ctx.restore();

    /* ── large half-disc (bottom-right, clipped) ── */
    const bigR  = Math.min(W, H) * 0.52;
    const bigCX = W * 0.78;
    const bigCY = H * 0.82;

    ctx.save();
    ctx.beginPath();
    ctx.arc(bigCX, bigCY, bigR, 0, Math.PI * 2);
    ctx.clip();

    /* disc fill */
    const discGrad = ctx.createRadialGradient(bigCX, bigCY, 0, bigCX, bigCY, bigR);
    discGrad.addColorStop(0,   'rgba(10,46,24,0.98)');
    discGrad.addColorStop(0.7, 'rgba(5,24,12,0.97)');
    discGrad.addColorStop(1,   'rgba(2,10,5,0.96)');
    ctx.fillStyle = discGrad;
    ctx.fill();

    mandala(bigCX, bigCY, bigR * 0.92, t * 0.00008, 0.7);
    ctx.restore();

    /* outer gold ring of big disc */
    ctx.beginPath();
    ctx.arc(bigCX, bigCY, bigR, 0, Math.PI * 2);
    ctx.strokeStyle = gold(0.75);
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(bigCX, bigCY, bigR * 1.003, 0, Math.PI * 2);
    ctx.strokeStyle = gold(0.25);
    ctx.lineWidth = 1;
    ctx.stroke();

    /* ── full circle disc (centre-right) ── */
    const smR  = Math.min(W, H) * 0.29;
    const smCX = W * 0.73;
    const smCY = H * 0.44;

    ctx.save();
    ctx.beginPath();
    ctx.arc(smCX, smCY, smR, 0, Math.PI * 2);
    ctx.clip();

    const smGrad = ctx.createRadialGradient(smCX, smCY, 0, smCX, smCY, smR);
    smGrad.addColorStop(0,  'rgba(12,52,28,0.98)');
    smGrad.addColorStop(0.6,'rgba(6,28,14,0.97)');
    smGrad.addColorStop(1,  'rgba(2,12,6,0.96)');
    ctx.fillStyle = smGrad;
    ctx.fill();

    mandala(smCX, smCY, smR * 0.92, -t * 0.00012, 0.9);
    ctx.restore();

    /* small disc border */
    ctx.beginPath();
    ctx.arc(smCX, smCY, smR, 0, Math.PI * 2);
    ctx.strokeStyle = gold(0.9);
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(smCX, smCY, smR * 1.004, 0, Math.PI * 2);
    ctx.strokeStyle = gold(0.3);
    ctx.lineWidth = 0.8;
    ctx.stroke();

    /* ── decorative sweep curve ── */
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(W * 0.18, -H * 0.05);
    ctx.bezierCurveTo(
      W * 0.55, H * 0.1,
      W * 0.9,  H * 0.3,
      W * 1.05, H * 0.75
    );
    ctx.strokeStyle = gold(0.35);
    ctx.lineWidth   = 1.8;
    ctx.stroke();
    /* inner sweep offset */
    ctx.beginPath();
    ctx.moveTo(W * 0.22, -H * 0.05);
    ctx.bezierCurveTo(
      W * 0.58, H * 0.12,
      W * 0.93, H * 0.32,
      W * 1.08, H * 0.76
    );
    ctx.strokeStyle = gold(0.12);
    ctx.lineWidth   = 6;
    ctx.stroke();
    ctx.restore();

    raf = requestAnimationFrame(draw);
  }

  raf = requestAnimationFrame(draw);
})();
</script>

const { useState, useEffect, useRef } = React;

/* ─── Logo image ─── */
function CrescentLogo({ size = 32 }) {
  return (
    <img
      src="uploads/logo.png"
      alt="Héritage Musulman"
      style={{
        width: size, height: size,
        objectFit: 'contain', display: 'block', opacity: "1"
      }} />);


}

/* ─── SVG: Star icon ─── */
function StarIcon({ size = 20, color = '#c8a727' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={color}>
      <path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z" />
    </svg>);

}

/* ─── Islamic Arabesque SVG ─── */
function ArabesqueDivider({ color = 'rgba(200,167,39,0.25)' }) {
  return (
    <svg width="120" height="24" viewBox="0 0 120 24" fill="none" style={{ display: 'block', margin: '0 auto' }}>
      <path d="M60 12 C50 6 40 6 30 12 C20 18 10 18 0 12" stroke={color} strokeWidth="1.5" fill="none" />
      <path d="M60 12 C70 6 80 6 90 12 C100 18 110 18 120 12" stroke={color} strokeWidth="1.5" fill="none" />
      <circle cx="60" cy="12" r="3" fill={color} />
      <circle cx="30" cy="12" r="1.5" fill={color} />
      <circle cx="90" cy="12" r="1.5" fill={color} />
    </svg>);

}

/* ─── Navbar ─── */
function Navbar() {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const navLinks = ['Accueil', 'Blind test', 'Quiz', 'Histoires', 'Parcours'];

  return (
    <nav style={{
      position: 'relative', zIndex: 100,
      background: 'transparent',
      backdropFilter: 'none',
      boxShadow: 'none',
      transition: 'all 0.3s ease',
      padding: '0 24px'
    }}>
      <div style={{
        maxWidth: 1200, margin: '0 auto',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        height: 80
      }}>
        {/* Logo */}
        <div style={{ cursor: 'pointer', marginTop: 10 }}>
          <CrescentLogo size={150} />
        </div>

        {/* Desktop nav links */}
        <div className="hide-mobile" style={{ display: 'flex', gap: 32, alignItems: 'center' }}>
          {navLinks.map((link) =>
          <a key={link} href="#" style={{
            color: 'rgba(255,255,255,0.82)',
            textDecoration: 'none',
            fontSize: 14,
            fontWeight: 500,
            transition: 'color 0.2s'
          }}
          onMouseEnter={(e) => e.target.style.color = '#c8a727'}
          onMouseLeave={(e) => e.target.style.color = 'rgba(255,255,255,0.82)'}>
            {link}</a>
          )}
        </div>

        {/* CTA buttons */}
        <div className="hide-mobile" style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <button style={{
            background: 'transparent', border: '1px solid rgba(255,255,255,0.3)',
            color: '#fff', padding: '8px 16px', borderRadius: 8,
            fontSize: 13, fontWeight: 600, cursor: 'pointer',
            transition: 'all 0.2s',
            fontFamily: 'Plus Jakarta Sans, sans-serif'
          }}
          onMouseEnter={(e) => {e.target.style.background = 'rgba(255,255,255,0.1)';}}
          onMouseLeave={(e) => {e.target.style.background = 'transparent';}}>
            Essai gratuit
          </button>
          <button style={{
            background: 'linear-gradient(135deg, #c8a727 0%, #e6c84a 100%)',
            border: 'none', color: '#ffffff', padding: '8px 18px', borderRadius: 8,
            fontSize: 13, fontWeight: 700, cursor: 'pointer',
            boxShadow: '0 2px 12px rgba(200,167,39,0.35)',
            transition: 'all 0.2s',
            fontFamily: 'Plus Jakarta Sans, sans-serif'

function App() {
  useEffect(() => {
    // Reveal observer
    const revealObs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          revealObs.unobserve(e.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal, .reveal-stagger').forEach((el) => revealObs.observe(el));

    // Counter observer
    const counterObs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        const el = e.target;
        const target = el.dataset.target;
        const isFloat = target.includes('.');
        const suffix = el.dataset.suffix || '';
        const prefix = el.dataset.prefix || '';
        const numTarget = parseFloat(target.replace(',', '.'));
        const duration = 1600;
        const start = performance.now();
        const animate = (now) => {
          const progress = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const value = numTarget * eased;
          if (isFloat) {
            el.textContent = prefix + value.toFixed(1).replace('.', ',') + suffix;
          } else {
            el.textContent = prefix + Math.round(value).toLocaleString('fr') + suffix;
          }
          if (progress < 1) requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
        counterObs.unobserve(el);
      });
    }, { threshold: 0.5 });

    document.querySelectorAll('[data-counter]').forEach((el) => counterObs.observe(el));

    return () => {revealObs.disconnect();counterObs.disconnect();};
  }, []);

  return (
    <>
      <Navbar />
      <main>
        <Hero />
        <ReassuranceBanner />
        <StatsBar />
        <FeatureCards />
        <ComparisonTable />
        <ParcoursSection />
        <SoftPaywall />
      </main>
      <Footer />
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
