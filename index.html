  /* Hero text backdrop */
  /* ═══ Hero ═══
     Mobile d'abord : 92-94 % du trafic.

     Le hero occupe tout l'ecran (100svh) et rien ne depasse dessous : la
     section suivante attend le premier scroll. Deux contraintes fixent la

  .hero-section {

    width: 100%; height: 252px; margin-bottom: 18px;
    display: flex; flex-direction: column; justify-content: center;
    padding: 15px 15px 17px; border-radius: 20px;
    background: linear-gradient(165deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));

  .peek-word {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 68px; padding: 8px 9px; border-radius: 12px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(230,200,74,0.18);
    transition: background .4s, border-color .4s, transform .4s cubic-bezier(.34,1.56,.64,1);
  }
  .peek-word.on {
    background: rgba(230,200,74,0.13); border-color: rgba(230,200,74,0.55);
    transform: translateY(-1px);
  }
  .pw-ar { font-family: Amiri, Georgia, serif; font-size: 24px; line-height: 1.3; color: #f7eecb; direction: rtl; }
  .pw-fr {
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 700;
    color: #e6c84a; opacity: 0; transition: opacity .35s; max-width: 13ch; line-height: 1.2;
  }
  .peek-word.on .pw-fr { opacity: 1; }

  .peek-foot {
    margin: 0; font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 12.5px; color: rgba(240,237,230,0.55); line-height: 1.4;
  }
  .peek-foot strong {
    font-size: 19px; font-weight: 900; color: #4ade80;
    font-variant-numeric: tabular-nums; margin-right: 6px;
  }

  /* Blind Test */
  .bt-wave { display: flex; align-items: center; justify-content: center; gap: 3px; height: 30px; margin-bottom: 11px; }
  .bt-wave i {
    width: 3.5px; border-radius: 2px; background: #4ade80;
    animation: eqBar 1s ease-in-out infinite; opacity: .85;
  }

  /* Options (Blind Test + Quiz) */
  .peek-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .peek-opt {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 11px 6px; border-radius: 12px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700;
    color: rgba(255,255,255,0.74);
    transition: background .4s, border-color .4s, color .4s;
  }
  .peek-opt.good {
    background: rgba(74,222,128,0.16); border-color: rgba(74,222,128,0.6); color: #eafff1;
  }
  .peek-opt b { color: #4ade80; font-size: 13px; }
  .peek-quiz .peek-foot { margin-top: 11px; }
  /* Le compteur « 740 questions » argumente ; le pourcentage de Comprendre,
     lui, EST la demonstration (il monte a mesure que les mots s'allument). Seul
     le premier sort du mobile. */
  @media (max-width: 768px) { .peek-quiz .peek-foot { display: none; } }

  /* ── Action ──
     Un seul bouton pour trois activites : il prend la couleur de l'onglet actif
     jusque dans son ombre. Le reflet qui le traverse toutes les 3,4 s est la
     seule chose qui bouge a cet endroit — sur mobile, sans survol, rien d'autre
     ne dit qu'un rectangle est cliquable. */
  .hero-cta {
    position: relative; overflow: hidden;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; max-width: 380px; border: none; border-radius: 100px;
    padding: 18px 26px; font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 17.5px; font-weight: 800; letter-spacing: -0.01em;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .2s, filter .2s, background .5s ease, box-shadow .5s ease, color .5s ease;
  }
  .hero-cta:hover { transform: translateY(-2px); filter: brightness(1.07); }
  .hero-cta:active { transform: translateY(0) scale(0.985); }
  .hero-cta:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .cta-txt, .cta-arrow { position: relative; z-index: 1; }
  .cta-arrow { font-size: 1.05em; transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  .hero-cta:hover .cta-arrow { transform: translateX(4px); }
  .cta-shine {
    position: absolute; top: 0; bottom: 0; left: -60%; width: 42%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.5), transparent);
    transform: skewX(-18deg); pointer-events: none;
    animation: ctaShine 3.4s ease-in-out infinite;
  }
  @keyframes ctaShine { 0%, 62% { left: -60%; } 88%, 100% { left: 120%; } }

  .hero-sub {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 3px 14px;
    margin: 13px 0 0; padding: 0; list-style: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13.5px; font-weight: 600; color: rgba(255,255,255,0.62);
  }
  .hero-sub li { display: inline-flex; align-items: center; gap: 5px; }
  @media (max-width: 768px) { .hero-sub .sub-wide { display: none; } }

  /* ── Hadith d'ouverture ──
     Il a quitte le hero : sur mobile il pesait 4 fragments sur 7 dans le
     premier ecran, pour un propos qui n'est pas une demonstration mais un
     pourquoi. Il ouvre maintenant ce que le premier scroll devoile — juste
     sous le trait, qui lui sert de filet. */
  .hero-hadith {
    margin: 26px auto 34px; max-width: 460px; padding: 0 18px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-align: center;
  }
  .hh-ar {
    margin: 0; font-family: Amiri, Georgia, serif;
    font-size: 19px; line-height: 1.5; color: rgba(247,238,203,0.7);
  }
  .hh-fr {
    margin: 0; font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic; font-size: 18px; line-height: 1.45;
    color: rgba(240,237,230,0.82);
  }
  .hh-src {
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 800;
    letter-spacing: 0.15em; text-transform: uppercase; color: rgba(200,167,39,0.75);
  }

  /* ── Invite a descendre ──
     Le hero remplit l'ecran : sans repere, rien ne dit qu'il y a une suite. */
  .hero-scroll {
    margin-top: 34px; padding: 6px 12px; background: none; border: none;
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .hero-scroll:focus-visible { outline: 2px solid #e6c84a; outline-offset: 3px; border-radius: 8px; }
  .hs-txt {
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.4);
    transition: color .25s;
  }
  .hero-scroll:hover .hs-txt { color: rgba(230,200,74,0.9); }
  .hs-line {
    position: relative; display: block; width: 1px; height: 26px;
    background: rgba(200,167,39,0.16); overflow: hidden;
  }
  .hs-line i {
    position: absolute; left: 0; width: 1px; height: 60%;
    background: linear-gradient(180deg, transparent, #e6c84a);
    animation: hsFall 1.9s ease-in-out infinite;
  }
  @keyframes hsFall {
    0% { top: -60%; opacity: 0; } 18% { opacity: 1; }
    78% { opacity: 1; } 100% { top: 100%; opacity: 0; }
  }

  /* ── Ce qui suit le hero ──
     Ne se devoile qu'au premier scroll, sinon le hero ne remplirait l'ecran
     qu'en apparence. Le filet se trace au passage : la separation est le
     mouvement lui-meme, pas une barre de plus.

     Nom distinct de .reveal, deja utilise partout sur le site par un autre
     observateur : deux systemes sur la meme classe, et chacun defaisait les
     regles de l'autre. Le trait se dessine en scaleX plutot qu'en largeur —
     transforme sur le GPU, et insensible au calcul de largeur du parent. */
  .hero-next {
    opacity: 0; transform: translateY(34px);
    transition: opacity .8s cubic-bezier(.22,1,.36,1), transform .8s cubic-bezier(.22,1,.36,1);
    will-change: opacity, transform;
  }
  /* will-change retire une fois l'animation jouee : le garder maintiendrait un
     calque en memoire pour rien pendant tout le reste de la visite. */
  .hero-next.in { opacity: 1; transform: none; will-change: auto; }
  .hero-next-sep {
    display: block; height: 1px; width: 88vw; max-width: 420px; margin: 0 auto;
    background: linear-gradient(90deg, transparent, rgba(200,167,39,0.8), transparent);
    transform: scaleX(0); transform-origin: center;
    transition: transform 1.2s cubic-bezier(.22,1,.36,1) .18s;
  }
  .hero-next.in .hero-next-sep { transform: scaleX(1); }

  /* Ecrans courts (iPhone SE/8 : 667 px, encore tres repandus).
     Tout se resserre, mais rien ne disparait tant que le bandeau cookies n'est
     pas la — voir la regle .has-cookiebar plus bas. */
  @media (max-height: 720px) {
    .hero-section { padding: 76px 18px calc(20px + var(--cookiebar)); }
    .hero-h1 { font-size: clamp(25px, 6.9vw, 36px); margin-bottom: 12px; }
    .hero-tabs { margin-bottom: 9px; }
    .hero-tab { padding: 8px 5px; font-size: 12.5px; }
    .hero-panel { height: 208px; padding: 11px 13px 13px; margin-bottom: 12px; }
    .peek-q { font-size: 13.5px; margin-bottom: 9px; }
    .peek-q-lg { font-size: 15px; }
    .peek-words { gap: 6px; margin-bottom: 9px; }
    .peek-word { padding: 5px 7px; }
    .pw-ar { font-size: 20px; }
    .pw-fr { font-size: 9px; }
    .peek-opt { padding: 8px 5px; font-size: 12.5px; }
    .bt-wave { height: 23px; margin-bottom: 8px; }
    .peek-foot { font-size: 11px; }
    .peek-foot strong { font-size: 16px; }
    .hero-cta { padding: 14px 22px; font-size: 15.5px; }
    .hero-sub { font-size: 12px; margin-top: 10px; gap: 2px 11px; }
    .hh-ar { font-size: 16px; line-height: 1.6; }
    .hh-fr { font-size: 14.5px; line-height: 1.4; }
    .hh-src { font-size: 9px; }
    .hero-scroll { margin-top: 22px; gap: 6px; }
    .hs-line { height: 24px; }
  }

  /* Allegement mobile.
     Sur 375 px le hero empilait une vingtaine de fragments de texte. Deux
     etaient de pures redites : le kicker repete le titre, et le tag du panneau
     (« LE CORAN MOT A MOT ») repete l'onglet deja surligne juste au-dessus. */
  @media (max-width: 768px) {
    .hero-kicker { display: none; }
    .hero-panel-tag { display: none; }
    .hero-panel { padding-top: 17px; }
  }

  /* Premiere visite uniquement : le bandeau de consentement prend ~130 px en
     bas de l'ecran. On lui rend la place en repliant le decoratif — la ligne
     arabe redit le francais juste dessous — plutot qu'en laissant le texte
     passer sous le bandeau. Des le consentement donne, tout revient. */
  @media (max-width: 768px) {
    html.has-cookiebar .hero-scroll { display: none; }
  }
  @media (max-width: 768px) and (max-height: 720px) {
    html.has-cookiebar .hero-panel { height: 196px; }
  }

  @media (min-width: 769px) {
    .hero-section { padding: 108px 24px 56px; }
    .hero-inner { max-width: 640px; }
    .hero-tabs { gap: 9px; margin-bottom: 13px; }
    .hero-tab { font-size: 14.5px; padding: 12px 8px; }
    .hero-panel { height: 286px; padding: 18px 22px 20px; }
    .peek-q { font-size: 17px; }
    .peek-q-lg { font-size: 18px; }
    .pw-ar { font-size: 27px; }
    .pw-fr { font-size: 11px; }
    .peek-words { grid-template-columns: repeat(4, 1fr); }
    .peek-word { padding: 9px 11px; }
    .peek-opt { font-size: 14.5px; padding: 11px; }
    .peek-foot { font-size: 13px; }
    .peek-foot strong { font-size: 20px; }
    .hero-cta { max-width: 420px; padding: 20px 30px; font-size: 19px; }
    .hero-sub { font-size: 14.5px; gap: 4px 20px; margin-top: 18px; }
    .hero-hadith { margin: 40px auto 46px; max-width: 520px; }
    .hh-ar { font-size: 22px; }
    .hh-fr { font-size: 19px; }
    .hh-src { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .peek { animation: none; }
    .hero-eq i, .bt-wave i { animation: none; height: 11px !important; }
    .peek-word, .peek-opt, .hero-cta, .hero-tab { transition: none; }
    .cta-shine { display: none; }
    .hs-line i { animation: none; }
    .hero-next { opacity: 1; transform: none; transition: none; }
    .hero-next-sep { transform: scaleX(1); transition: none; }
  }

  /* Section text backdrop */
  .section-text-backdrop {
    position: relative;
  }
  .section-text-backdrop::before {
    content: '';
    position: absolute;
    inset: -32px -48px;
    background: radial-gradient(ellipse at center, rgba(2,10,5,0.82) 0%, rgba(2,10,5,0.4) 55%, transparent 78%);
    pointer-events: none;
    z-index: 0;
    border-radius: 24px;
  }
  .section-text-backdrop > * { position: relative; z-index: 1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--green-xlight); }
  ::-webkit-scrollbar-thumb { background: var(--green-dark); border-radius: 3px; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmer {

    50%       { box-shadow: 0 0 18px 6px rgba(255,235,80,0.85), 0 0 48px 14px rgba(200,167,39,0.55), 0 4px 30px rgba(255,200,0,0.7); }

  .sp-2 { animation: spFadeUp 0.75s cubic-bezier(0.16,1,0.3,1) 0.18s both; }

  @keyframes crownBob {

  /* ── Nouveaux keyframes variés ── */
  @keyframes blurFadeUp {
    from { opacity: 0; filter: blur(12px); transform: translateY(32px); }
    to   { opacity: 1; filter: blur(0);    transform: translateY(0); }
  }
  @keyframes zoomFadeIn {
    from { opacity: 0; transform: scale(0.88); }
    to   { opacity: 1; transform: scale(1); }
  }

    from { opacity: 0; transform: translateX(-56px); }

    from { opacity: 0; transform: translateX(56px); }
    to   { opacity: 1; transform: translateX(0); }
  }

    82%  { opacity: 1; transform: translateY(0); filter: blur(0); }

    0%, 100% { height: 7px; }

  /* ── Classes scroll-reveal enrichies ── */
  .reveal-blur {
    opacity: 0; transform: translateY(28px);
    transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1), transform 0.65s cubic-bezier(0.22,1,0.36,1);
    will-change: transform, opacity;
  }
  .reveal-blur.visible { opacity: 1; transform: translateY(0); }

  .reveal-zoom {
    opacity: 0; transform: scale(0.88);
    transition: opacity 0.6s cubic-bezier(0.34,1.4,0.64,1), transform 0.6s cubic-bezier(0.34,1.4,0.64,1);
    will-change: transform, opacity;
  }
  .reveal-zoom.visible { opacity: 1; transform: scale(1); }

  .reveal-drop {
    opacity: 0; transform: translateY(-28px) scale(0.97);
    transition: opacity 0.6s cubic-bezier(0.22,1,0.36,1), transform 0.6s cubic-bezier(0.34,1.3,0.64,1);
    will-change: transform, opacity;
  }
  .reveal-drop.visible { opacity: 1; transform: translateY(0) scale(1); }

  .reveal-glow {
    opacity: 0; transform: translateY(20px);
    transition: opacity 0.7s cubic-bezier(0.22,1,0.36,1), transform 0.7s cubic-bezier(0.22,1,0.36,1);
    will-change: transform, opacity;
  }
  .reveal-glow.visible { opacity: 1; transform: translateY(0); }

  /* stagger jusqu'à 8 enfants */
  .reveal-stagger > *:nth-child(7) { transition-delay: 0.9s; }
  .reveal-stagger > *:nth-child(8) { transition-delay: 1.05s; }
  .reveal-stagger.visible > *:nth-child(7) { opacity:1; transform:translateY(0) scale(1); transition-delay: 0.9s; }
  .reveal-stagger.visible > *:nth-child(8) { opacity:1; transform:translateY(0) scale(1); transition-delay: 1.05s; }

  /* Card stagger latéral alterné */
  .reveal-cards > * {
    opacity: 0; transform: translateY(48px) scale(0.94);
    transition: opacity 0.8s cubic-bezier(0.22,1,0.36,1),
                transform 0.8s cubic-bezier(0.34,1.3,0.64,1);
  }
  .reveal-cards.visible > *:nth-child(1) { opacity:1; transform:none; transition-delay: 0s; }
  .reveal-cards.visible > *:nth-child(2) { opacity:1; transform:none; transition-delay: 0.18s; }
  .reveal-cards.visible > *:nth-child(3) { opacity:1; transform:none; transition-delay: 0.36s; }
  .reveal-cards.visible > *:nth-child(4) { opacity:1; transform:none; transition-delay: 0.54s; }
  .reveal-cards.visible > *:nth-child(5) { opacity:1; transform:none; transition-delay: 0.72s; }
  .reveal-cards.visible > *:nth-child(6) { opacity:1; transform:none; transition-delay: 0.9s; }
  .reveal-cards.visible > *:nth-child(7) { opacity:1; transform:none; transition-delay: 1.08s; }
  .reveal-cards.visible > *:nth-child(8) { opacity:1; transform:none; transition-delay: 1.26s; }

  /* Ligne de divider qui s'étend */
  .reveal-line {
    opacity: 0; transform: scaleX(0); transform-origin: left;
    transition: opacity 0.6s ease, transform 0.9s cubic-bezier(0.22,1,0.36,1);
  }
  .reveal-line.visible { opacity: 1; transform: scaleX(1); }

  .reveal-blur:not(.visible),
  .reveal-zoom:not(.visible),
  .reveal-drop:not(.visible),
  .reveal-glow:not(.visible),
  .reveal-cards:not(.visible) > * {
    transition: opacity 0.2s ease, transform 0.2s ease, filter 0.2s ease;
  }
