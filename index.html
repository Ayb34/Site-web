/* ─── App ─── */
function App() {
  const [page, setPage] = React.useState(function () {
    const h = window.location.hash.slice(1);
    return h || 'home';
  });
  const [user, setUser] = React.useState(undefined);
  const [isPro, setIsPro] = React.useState(false);
  const [showAuth, setShowAuth] = React.useState(false);

  // Write page to hash so refresh restores it
  React.useEffect(function () {
    window.location.hash = page === 'home' ? '' : page;
  }, [page]);

  // Handle browser back/forward
  React.useEffect(function () {
    function onHashChange() {
      const h = window.location.hash.slice(1);
      setPage(h || 'home');
    }
    window.addEventListener('hashchange', onHashChange);
    return function () {window.removeEventListener('hashchange', onHashChange);};
  }, []);

  useEffect(() => {
    // Reveal observer — rejoue à chaque fois (scroll haut ET bas)
    const CLASSES = '.reveal, .reveal-left, .reveal-right, .reveal-scale, .reveal-flip, .reveal-stagger, .reveal-stagger-alt, .reveal-blur, .reveal-zoom, .reveal-drop, .reveal-glow, .reveal-cards, .reveal-line';
    const revealObs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          // petit délai pour laisser le reset CSS s'appliquer
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              e.target.classList.add('visible');
            });
          });
        } else {
          e.target.classList.remove('visible');
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });

    document.querySelectorAll(CLASSES).forEach((el) => revealObs.observe(el));

    // Counter observer
    const counterObs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        const el = e.target;
        const target = el.dataset.target;
        const isFloat = target.includes('.');
        const suffix = el.dataset.suffix || '';
        const prefix = el.dataset.prefix || '';
        const numTarget = parseFloat(target.replace(',', '.'));
        const duration = 1600;
        const start = performance.now();
        const animate = (now) => {
          const progress = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const value = numTarget * eased;
          if (isFloat) {
            el.textContent = prefix + value.toFixed(1).replace('.', ',') + suffix;
          } else {
            el.textContent = prefix + Math.round(value).toLocaleString('fr') + suffix;
          }
          if (progress < 1) requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
        counterObs.unobserve(el);
      });
    }, { threshold: 0.5 });

    document.querySelectorAll('[data-counter]').forEach((el) => counterObs.observe(el));

    return () => {revealObs.disconnect();counterObs.disconnect();};
  }, []);

  React.useEffect(() => {
    if (!window._auth) { setUser(null); return; }
    const unsub = window._auth.onAuthStateChanged(u => setUser(u || null));
    return unsub;
  }, []);

  // Écoute statut Pro depuis Firestore
  React.useEffect(function() {
    if (!user || !window._db) { setIsPro(false); return; }
    var unsub = window._db.collection('users').doc(user.uid)
      .onSnapshot(function(doc) {
        setIsPro(doc.exists && doc.data().isPro === true);
      }, function() { setIsPro(false); });
    return unsub;
  }, [user]);

  const authCtx = {
    user,
    isPro,
    logout: () => window._auth && window._auth.signOut(),
    openAuth: () => setShowAuth(true),
    onAuthSuccess: (action) => {
      setShowAuth(false);
      if (action === 'signup') setPage('subscription');
    }
  };

  const wrap = (children) => (
    <AuthContext.Provider value={authCtx}>
      {showAuth && <AuthModal onClose={() => setShowAuth(false)} />}
      {children}
    </AuthContext.Provider>
  );

  if (page === 'blind-test') return wrap(<BlindTestPage navigate={setPage} />);
  if (page === 'quiz') return wrap(<QuizPage navigate={setPage} />);
  if (page.startsWith('quiz-')) {
    const rest = page.slice(5);
    const levels = ['debutant', 'amateur', 'avance'];
    const lv = levels.find((l) => rest.endsWith('-' + l));
    if (lv) {
      const ck = rest.slice(0, rest.length - lv.length - 1);
      return wrap(<QuizCategoryPage catKey={ck} level={lv} navigate={setPage} />);
    }
    return wrap(<QuizCategoryPage catKey={rest} level="debutant" navigate={setPage} />);
  }
  if (page === 'studio') return wrap(<VideoCreatorPage navigate={setPage} />);
  if (page === 'start') return wrap(<StartPage navigate={setPage} />);
  if (page === 'subscription') return wrap(<><Navbar navigate={setPage} /><SubscriptionPage navigate={setPage} /></>);
  if (page === 'profile') return wrap(<><Navbar navigate={setPage} /><ProfilePage navigate={setPage} /></>);
  if (page === 'mentions-legales') return wrap(<MentionsLegalesPage navigate={setPage} />);
  if (page === 'cgu') return wrap(<CguPage navigate={setPage} />);
  if (page === 'confidentialite') return wrap(<PolitiqueConfidentialitePage navigate={setPage} />);

  if (page !== 'home') return wrap(<NotFoundPage navigate={setPage} />);

  return wrap(
    <>
      <Navbar navigate={setPage} />
      <main>
        <Hero navigate={setPage} />
        <ReassuranceBanner />
        <FeatureCards navigate={setPage} />
        <HowItWorksSection />
        <LearnPlaySection navigate={setPage} />
        <StudioViralSection navigate={setPage} />
        <ImportanceSection />
        <TestimonialsSection />
        <ComparisonTable />
        <ParcoursSection />
        <StatsBar />
        <FaqSection />
        <SoftPaywall />
      </main>
      <Footer navigate={setPage} />
    </>
  );

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
