<script>
(function() {
  const canvas = document.getElementById('mandala-bg');
  const ctx = canvas.getContext('2d');
  let W, H, raf;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.5, W * 0.95);
    bg.addColorStop(0,    '#061a0c');
    bg.addColorStop(0.45, '#030e06');
    bg.addColorStop(1,    '#010503');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
  }

  draw();
  window.addEventListener('resize', draw);
})();
</script>

          onMouseLeave={(e) => {e.target.style.background = 'transparent'; e.target.style.borderColor = 'rgba(255,255,255,0.25)';}}>
            Essai gratuit

  {n:73,ar:'المزمل',fr:'Al-Muzzammil',a:20},{n:74,ar:'المدثر',fr:'Al-Muddaththir',a:56},{n:75,ar:'القيامة',fr:'Al-Qiyama',a:40},
  {n:76,ar:'الإنسان',fr:'Al-Insan',a:31},{n:77,ar:'المرسلات',fr:'Al-Mursalat',a:50},{n:78,ar:'النبأ',fr:'An-Naba',a:40},
  {n:79,ar:'النازعات',fr:'An-Naziat',a:46},{n:80,ar:'عبس',fr:'Abasa',a:42},{n:81,ar:'التكوير',fr:'At-Takwir',a:29},
  {n:82,ar:'الانفطار',fr:'Al-Infitar',a:19},{n:83,ar:'المطففين',fr:'Al-Mutaffifin',a:36},{n:84,ar:'الانشقاق',fr:'Al-Inshiqaq',a:25},
  {n:85,ar:'البروج',fr:'Al-Buruj',a:22},{n:86,ar:'الطارق',fr:'At-Tariq',a:17},{n:87,ar:'الأعلى',fr:'Al-Ala',a:19},
  {n:88,ar:'الغاشية',fr:'Al-Ghashiya',a:26},{n:89,ar:'الفجر',fr:'Al-Fajr',a:30},{n:90,ar:'البلد',fr:'Al-Balad',a:20},
  {n:91,ar:'الشمس',fr:'Ash-Shams',a:15},{n:92,ar:'الليل',fr:'Al-Layl',a:21},{n:93,ar:'الضحى',fr:'Ad-Duha',a:11},
  {n:94,ar:'الشرح',fr:'Ash-Sharh',a:8},{n:95,ar:'التين',fr:'At-Tin',a:8},{n:96,ar:'العلق',fr:'Al-Alaq',a:19},
  {n:97,ar:'القدر',fr:'Al-Qadr',a:5},{n:98,ar:'البينة',fr:'Al-Bayyina',a:8},{n:99,ar:'الزلزلة',fr:'Az-Zalzala',a:8},
  {n:100,ar:'العاديات',fr:'Al-Adiyat',a:11},{n:101,ar:'القارعة',fr:'Al-Qaria',a:11},{n:102,ar:'التكاثر',fr:'At-Takathur',a:8},
  {n:103,ar:'العصر',fr:'Al-Asr',a:3},{n:104,ar:'الهمزة',fr:'Al-Humaza',a:9},{n:105,ar:'الفيل',fr:'Al-Fil',a:5},
  {n:106,ar:'قريش',fr:'Quraysh',a:4},{n:107,ar:'الماعون',fr:'Al-Maun',a:7},{n:108,ar:'الكوثر',fr:'Al-Kawthar',a:3},
  {n:109,ar:'الكافرون',fr:'Al-Kafirun',a:6},{n:110,ar:'النصر',fr:'An-Nasr',a:3},{n:111,ar:'المسد',fr:'Al-Masad',a:5},
  {n:112,ar:'الإخلاص',fr:'Al-Ikhlas',a:4},{n:113,ar:'الفلق',fr:'Al-Falaq',a:5},{n:114,ar:'الناس',fr:'An-Nas',a:6}
];

const RECITERS = [
  { id: 'Alafasy_128kbps',             name: 'Mishary Alafasy' },
  { id: 'Abdurrahmaan_As-Sudais_192kbps', name: 'Abdurrahman As-Sudais' },
  { id: 'Abdul_Basit_Murattal_192kbps', name: 'Abdul Basit' },
  { id: 'Husary_128kbps',               name: 'Mahmoud Al-Husary' },
  { id: 'Nasser_Alqatami_128kbps',       name: 'Nasser Al-Qatami' },
  { id: 'MaherAlMuaiqly128kbps',        name: 'Maher Al-Muaiqly' },
];

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pad3(n)        { return String(n).padStart(3, '0'); }

const DEBUTANT_NBS = new Set([1, 94, 97, 102, 103, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114]);
const DIFF_POOLS = {
  debutant: SURAHS.filter(s => DEBUTANT_NBS.has(s.n)),  // 15 sourates choisies
  amateur:  SURAHS.filter(s => s.n >= 36),               // 79 sourates
  avance:   SURAHS,                                       // toutes
};

function BlindTestPage({ navigate }) {
  const [state,      setState]      = React.useState('idle');
  const [difficulty, setDifficulty] = React.useState(null);
  const [question,   setQuestion]   = React.useState(null);
  const [chosen,     setChosen]     = React.useState(null);
  const [score,      setScore]      = React.useState({ ok: 0, total: 0 });
  const [streak,     setStreak]     = React.useState(0);
  const [isPlaying,    setIsPlaying]    = React.useState(false);
  const [verseText,    setVerseText]    = React.useState(null);
  const [reciterId,    setReciterId]    = React.useState(null);
  const [sessionCount, setSessionCount] = React.useState(0);   // questions répondues
  const [sessionOk,    setSessionOk]    = React.useState(0);   // bonnes réponses session
  const audioRef = React.useRef(null);

  const SESSION_SIZE = 10;
  const NEXT_DIFF = { debutant: 'amateur', amateur: 'avance', avance: null };

  React.useEffect(() => () => { if (audioRef.current) audioRef.current.pause(); }, []);

  function buildQuestion(diff, fallbackId) {
    const pool     = DIFF_POOLS[diff];
    const surahIdx = rnd(0, pool.length - 1);
    const surah    = pool[surahIdx];
    const ayah     = rnd(1, surah.a);
    const effectiveId = fallbackId !== undefined ? fallbackId : reciterId;
    const reciter  = effectiveId ? RECITERS.find(r => r.id === effectiveId) : RECITERS[rnd(0, RECITERS.length - 1)];

    const wrongSet = new Set([surah.n]);
    while (wrongSet.size < 3) wrongSet.add(pool[rnd(0, pool.length - 1)].n);
    const choices = [...wrongSet]
      .filter(n => n !== surah.n).slice(0, 2)
      .map(n => SURAHS.find(s => s.n === n))
      .concat(surah)
      .sort(() => Math.random() - 0.5);

    const url = `https://everyayah.com/data/${reciter.id}/${pad3(surah.n)}${pad3(ayah)}.mp3`;
    return { surah, ayah, reciter, choices, url };
  }

  async function fetchVerse(surahN, ayahN) {
    try {
      const res = await fetch(`https://api.alquran.cloud/v1/ayah/${surahN}:${ayahN}/editions/quran-simple,fr.hamidullah`);
      const data = await res.json();
      if (data.code === 200) {
        setVerseText({ ar: data.data[0].text, fr: data.data[1].text });
      }
    } catch(e) { /* silently fail */ }
  }

  function launch(retry) {
    const retryCount = retry || 0;
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    // After 3 failures, fall back to Alafasy (always available) to avoid infinite loop
    const fallback = retryCount >= 3 ? 'Alafasy_128kbps' : undefined;
    const q = buildQuestion(difficulty, fallback);
    setQuestion(q);
    setChosen(null);
    setVerseText(null);
    setState('loading');
    setIsPlaying(false);
    fetchVerse(q.surah.n, q.ayah);

    const audio = new Audio(q.url);
    audioRef.current = audio;
    audio.oncanplay  = () => { setState('playing'); audio.play(); setIsPlaying(true); };
    audio.onplay     = () => setIsPlaying(true);
    audio.onpause    = () => setIsPlaying(false);
    audio.onended    = () => setIsPlaying(false);
    audio.onerror    = () => launch(retryCount + 1);
    audio.load();
  }

  function togglePlay() {
    if (!audioRef.current) return;
    if (isPlaying) { audioRef.current.pause(); }
    else           { audioRef.current.play();  }
  }

  function answer(choice) {
    if (state !== 'playing') return;
    const correct = choice.n === question.surah.n;
    setChosen(choice.n);
    setState('answered');
    setScore(s => ({ ok: s.ok + (correct ? 1 : 0), total: s.total + 1 }));
    setStreak(s => correct ? s + 1 : 0);
    setSessionCount(c => c + 1);
    setSessionOk(c => c + (correct ? 1 : 0));
    if (audioRef.current) audioRef.current.pause();
  }

  function goNextOrBilan() {
    if (sessionCount + 1 >= SESSION_SIZE) {
      setState('bilan');
    } else {
      launch();
    }
  }

  function continueLevel() {
    setSessionCount(0); setSessionOk(0);
    setState('loading');
    launch();
  }

  function goNextLevel() {
    const next = NEXT_DIFF[difficulty];
    setDifficulty(next);
    setSessionCount(0); setSessionOk(0);
    setState('loading');
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    const q = buildQuestion(next);
    setQuestion(q); setChosen(null); setVerseText(null); setIsPlaying(false);
    fetchVerse(q.surah.n, q.ayah);
    const audio = new Audio(q.url);
    audioRef.current = audio;
    audio.oncanplay = () => { setState('playing'); audio.play(); setIsPlaying(true); };
    audio.onplay    = () => setIsPlaying(true);
    audio.onpause   = () => setIsPlaying(false);
    audio.onended   = () => setIsPlaying(false);
    audio.onerror   = () => launch(1);
    audio.load();
  }

  const correct = chosen !== null && question && chosen === question.surah.n;

  const DIFF_LABELS = {
    debutant: { label: 'Débutant(e)',  desc: 'Sourates courtes (Juz Amma)',  color: '#4ade80' },
    amateur:  { label: 'Amateur',      desc: 'Sourates moyennes',             color: '#c8a727' },
    avance:   { label: 'Avancé(e)',    desc: 'Tout le Coran',                 color: '#f87171' },
  };

  return (
    <div className="fade-up" style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '90px 24px 80px', fontFamily: 'Plus Jakarta Sans, sans-serif' }}>

      {/* Retour */}
      <button onClick={() => { if (audioRef.current) audioRef.current.pause(); navigate('home'); }} style={{
        position: 'fixed', top: 24, left: 24, zIndex: 200,
        background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.15)',
        color: 'rgba(255,255,255,0.7)', padding: '8px 16px', borderRadius: 8,
        fontSize: 13, fontWeight: 600, cursor: 'pointer', transition: 'all 0.2s'
      }}
      onMouseEnter={(e) => e.currentTarget.style.background = 'rgba(255,255,255,0.12)'}
      onMouseLeave={(e) => e.currentTarget.style.background = 'rgba(255,255,255,0.06)'}>← Retour</button>

      {/* Score */}
      {score.total > 0 && (
        <div style={{ position: 'fixed', top: 24, right: 24, zIndex: 200, display: 'flex', gap: 10 }}>
          <div style={{ background: 'rgba(200,167,39,0.15)', border: '1px solid rgba(200,167,39,0.3)', borderRadius: 8, padding: '6px 14px', color: '#c8a727', fontSize: 13, fontWeight: 700 }}>
            {score.ok}/{score.total}
          </div>
          {streak >= 2 && (
            <div style={{ background: 'rgba(255,150,50,0.15)', border: '1px solid rgba(255,150,50,0.3)', borderRadius: 8, padding: '6px 14px', color: '#ff9632', fontSize: 13, fontWeight: 700 }}>
              🔥 {streak}
            </div>
          )}
        </div>
      )}

      {/* ── Titre grand format or ── */}
      <h1 style={{
        fontSize: 'clamp(48px, 9vw, 108px)', fontWeight: 900, letterSpacing: '-3px',
        lineHeight: 1.0, textAlign: 'center', margin: '0 0 12px',
        color: '#c8a727',
        textShadow: '0 2px 32px rgba(230,200,74,0.35)'
      }}>Blind test Coran</h1>
      <p style={{ color: '#ffffff', fontSize: 15, margin: '0 0 48px', textAlign: 'center', letterSpacing: '0.04em' }}>
        Écoute le verset — devine la sourate
      </p>

      <div style={{ width: '100%', maxWidth: 560 }}>

        {/* ── Écran idle : choix difficulté + commencer ── */}
        {state === 'idle' && (
          <div style={{ textAlign: 'center' }}>
            <p style={{ color: '#ffffff', fontSize: 14, marginBottom: 20, fontWeight: 600, letterSpacing: '0.06em', textTransform: 'uppercase' }}>Choisir le niveau</p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 36 }}>
              {Object.entries(DIFF_LABELS).map(([key, val]) => (
                <button key={key} onClick={() => setDifficulty(key)} style={{
                  width: '100%', padding: '16px 24px', borderRadius: 12,
                  background: difficulty === key ? `rgba(${key==='debutant'?'74,222,128':key==='amateur'?'200,167,39':'248,113,113'},0.12)` : 'rgba(255,255,255,0.04)',
                  border: difficulty === key ? `1.5px solid ${val.color}` : '1.5px solid rgba(255,255,255,0.1)',
                  color: difficulty === key ? val.color : 'rgba(255,255,255,0.7)',
                  cursor: 'pointer', transition: 'all 0.2s',
                  display: 'flex', alignItems: 'center', justifyContent: 'space-between'
                }}>
                  <div style={{ textAlign: 'left' }}>
                    <div style={{ fontSize: 16, fontWeight: 700 }}>{val.label}</div>
                    <div style={{ fontSize: 12, opacity: 0.6, marginTop: 2 }}>{val.desc}</div>
                  </div>
                  {difficulty === key && <span style={{ fontSize: 18 }}>✓</span>}
                </button>
              ))}
            </div>

            {/* ── Récitateur ── */}
            <p style={{ color: '#ffffff', fontSize: 14, marginBottom: 14, fontWeight: 600, letterSpacing: '0.06em', textTransform: 'uppercase' }}>Récitateur</p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 36 }}>
              {/* Option aléatoire */}
              <button onClick={() => setReciterId(null)} style={{
                width: '100%', padding: '12px 20px', borderRadius: 10,
                background: reciterId === null ? 'rgba(200,167,39,0.12)' : 'rgba(255,255,255,0.04)',
                border: reciterId === null ? '1.5px solid rgba(200,167,39,0.5)' : '1.5px solid rgba(255,255,255,0.1)',
                color: reciterId === null ? '#c8a727' : 'rgba(255,255,255,0.65)',
                cursor: 'pointer', transition: 'all 0.2s', textAlign: 'left', fontSize: 14, fontWeight: 600,
                display: 'flex', justifyContent: 'space-between'
              }}>
                <span>🎲 Aléatoire</span>
                {reciterId === null && <span>✓</span>}
              </button>
              {RECITERS.map(r => (
                <button key={r.id} onClick={() => setReciterId(r.id)} style={{
                  width: '100%', padding: '12px 20px', borderRadius: 10,
                  background: reciterId === r.id ? 'rgba(200,167,39,0.12)' : 'rgba(255,255,255,0.04)',
                  border: reciterId === r.id ? '1.5px solid rgba(200,167,39,0.5)' : '1.5px solid rgba(255,255,255,0.1)',
                  color: reciterId === r.id ? '#c8a727' : 'rgba(255,255,255,0.65)',
                  cursor: 'pointer', transition: 'all 0.2s', textAlign: 'left', fontSize: 14, fontWeight: 600,
                  display: 'flex', justifyContent: 'space-between'
                }}>
                  <span>🎙 {r.name}</span>
                  {reciterId === r.id && <span>✓</span>}
                </button>
              ))}
            </div>

            <button onClick={() => difficulty && launch()} style={{
              background: difficulty ? 'linear-gradient(135deg, #a8891f, #c4a83a)' : 'rgba(255,255,255,0.08)',
              border: 'none', color: difficulty ? '#f5edd8' : 'rgba(255,255,255,0.3)',
              padding: '18px 52px', borderRadius: 14, fontSize: 18,
              fontWeight: 800, cursor: difficulty ? 'pointer' : 'default',
              letterSpacing: '-0.2px', boxShadow: difficulty ? '0 4px 24px rgba(160,130,25,0.3)' : 'none',
              transition: 'all 0.2s'
            }}
            onMouseEnter={(e) => { if (difficulty) e.currentTarget.style.transform = 'scale(1.04)'; }}
            onMouseLeave={(e) => e.currentTarget.style.transform = 'scale(1)'}>
              ▶ Commencer
            </button>
          </div>
        )}

        {/* ── Chargement ── */}
        {state === 'loading' && (
          <div style={{ textAlign: 'center', padding: 40 }}>
            <div style={{ width: 56, height: 56, borderRadius: '50%', border: '3px solid rgba(200,167,39,0.2)', borderTopColor: '#c8a727', margin: '0 auto 16px', animation: 'spin 0.8s linear infinite' }} />
            <p style={{ color: 'rgba(255,255,255,0.4)', fontSize: 14 }}>Chargement du verset…</p>
          </div>
        )}

        {/* ── Bilan session ── */}
        {state === 'bilan' && (
          <div style={{ textAlign: 'center' }}>
            {/* Score visuel */}
            <div style={{ marginBottom: 32 }}>
              <div style={{ fontSize: 80, fontWeight: 900, lineHeight: 1, color: sessionOk >= 8 ? '#4ade80' : sessionOk >= 5 ? '#e6c84a' : '#f87171' }}>
                {sessionOk}<span style={{ fontSize: 40, color: 'rgba(255,255,255,0.3)' }}>/{SESSION_SIZE}</span>
              </div>
              <p style={{ fontSize: 22, fontWeight: 800, marginTop: 8, color: sessionOk >= 8 ? '#4ade80' : sessionOk >= 5 ? '#e6c84a' : '#f87171' }}>
                {sessionOk === SESSION_SIZE ? '🏆 Parfait !' : sessionOk >= 8 ? '⭐ Excellent !' : sessionOk >= 6 ? '👍 Bien joué !' : sessionOk >= 4 ? '💪 Pas mal !' : '📖 Continue à pratiquer'}
              </p>
              {/* Barre de score */}
              <div style={{ margin: '16px auto 0', maxWidth: 280, height: 8, background: 'rgba(255,255,255,0.08)', borderRadius: 4, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${(sessionOk / SESSION_SIZE) * 100}%`, background: sessionOk >= 8 ? '#4ade80' : sessionOk >= 5 ? '#e6c84a' : '#f87171', borderRadius: 4, transition: 'width 1s ease' }} />
              </div>
              {/* Pastilles */}
              <div style={{ display: 'flex', gap: 6, justifyContent: 'center', marginTop: 14, flexWrap: 'wrap' }}>
                {Array.from({ length: SESSION_SIZE }).map((_, i) => (
                  <div key={i} style={{ width: 28, height: 28, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, background: i < sessionOk ? 'rgba(74,222,128,0.15)' : 'rgba(255,255,255,0.05)', border: `1.5px solid ${i < sessionOk ? '#4ade80' : 'rgba(255,255,255,0.15)'}` }}>
                    {i < sessionOk ? '✓' : ''}
                  </div>
                ))}
              </div>
            </div>

            {/* Niveau actuel */}
            <p style={{ color: 'rgba(255,255,255,0.4)', fontSize: 13, marginBottom: 20 }}>
              Niveau actuel : <span style={{ color: '#c8a727', fontWeight: 700 }}>
                {{ debutant: 'Débutant(e)', amateur: 'Amateur', avance: 'Avancé(e)' }[difficulty]}
              </span>
            </p>

            {/* Actions */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, maxWidth: 360, margin: '0 auto' }}>
              {/* Niveau supérieur si score >= 6 et pas déjà avancé */}
              {NEXT_DIFF[difficulty] && sessionOk >= 6 && (
                <button onClick={goNextLevel} style={{
                  background: 'linear-gradient(135deg,#a8891f,#c4a83a)', border: 'none',
                  color: '#f5edd8', padding: '16px 24px', borderRadius: 12, fontSize: 16,
                  fontWeight: 800, cursor: 'pointer', transition: 'all 0.2s',
                  display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8
                }}
                onMouseEnter={(e) => e.currentTarget.style.transform='scale(1.03)'}
                onMouseLeave={(e) => e.currentTarget.style.transform='scale(1)'}>
                  ✦ Passer au niveau {{ debutant:'Amateur', amateur:'Avancé(e)' }[difficulty]}
                </button>
              )}
              <button onClick={continueLevel} style={{
                background: 'rgba(255,255,255,0.06)', border: '1.5px solid rgba(255,255,255,0.15)',
                color: '#fff', padding: '14px 24px', borderRadius: 12, fontSize: 15,
                fontWeight: 700, cursor: 'pointer', transition: 'all 0.2s'
              }}
              onMouseEnter={(e) => e.currentTarget.style.background='rgba(255,255,255,0.12)'}
              onMouseLeave={(e) => e.currentTarget.style.background='rgba(255,255,255,0.06)'}>
                🔄 Continuer ce niveau
              </button>
              <button onClick={() => { setSessionCount(0); setSessionOk(0); setScore({ ok:0, total:0 }); setState('idle'); }} style={{
                background: 'transparent', border: 'none',
                color: 'rgba(255,255,255,0.35)', fontSize: 13, cursor: 'pointer', padding: '8px'
              }}>
                Changer de niveau / récitateur
              </button>
            </div>
          </div>
        )}

        {/* ── Playing / Answered ── */}
        {(state === 'playing' || state === 'answered') && question && (
          <>
            {/* Progression session */}
            <div style={{ display: 'flex', gap: 4, justifyContent: 'center', marginBottom: 20 }}>
              {Array.from({ length: SESSION_SIZE }).map((_, i) => (
                <div key={i} style={{ width: 24, height: 5, borderRadius: 3, background: i < sessionCount ? '#c8a727' : 'rgba(255,255,255,0.12)', transition: 'background 0.3s' }} />
              ))}
            </div>
            {/* Info récitateur */}
            <div style={{ textAlign: 'center', marginBottom: 28 }}>
              <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 20, padding: '6px 16px' }}>
                <span style={{ fontSize: 15 }}>🎙</span>
                <span style={{ color: 'rgba(255,255,255,0.6)', fontSize: 13 }}>{question.reciter.name}</span>
                <span style={{ color: 'rgba(255,255,255,0.25)', fontSize: 12 }}>· Verset {question.ayah}</span>
              </div>
            </div>

            {/* ── Bouton Play / Pause ── */}
            <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 28 }}>
              <button onClick={togglePlay} style={{
                width: 84, height: 84, borderRadius: '50%',
                background: isPlaying
                  ? 'linear-gradient(135deg,#a8891f,#c4a83a)'
                  : 'rgba(200,167,39,0.12)',
                border: isPlaying ? 'none' : '2px solid rgba(200,167,39,0.35)',
                color: '#f5edd8', fontSize: 30, cursor: 'pointer',
                boxShadow: isPlaying ? '0 0 36px rgba(200,167,39,0.4)' : 'none',
                transition: 'all 0.25s', display: 'flex', alignItems: 'center', justifyContent: 'center'
              }}>
                {isPlaying ? '⏸' : '▶'}
              </button>
            </div>

            {/* ── Texte du verset (arabe + français) ── */}
            {verseText && (
              <div style={{
                background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(200,167,39,0.15)',
                borderRadius: 14, padding: '20px 24px', marginBottom: 28, textAlign: 'center'
              }}>
                <p style={{
                  fontFamily: 'serif', fontSize: 'clamp(20px,4vw,28px)', color: 'rgba(255,248,220,0.92)',
                  lineHeight: 1.8, direction: 'rtl', margin: '0 0 14px', letterSpacing: '0.05em'
                }}>{verseText.ar}</p>
                <p style={{ color: 'rgba(255,255,255,0.45)', fontSize: 13, lineHeight: 1.6, margin: 0, fontStyle: 'italic' }}>
                  {verseText.fr}
                </p>
              </div>
            )}

            {/* ── Choix de sourate ── */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {question.choices.map((choice) => {
                const isCorrect = choice.n === question.surah.n;
                const isChosen  = chosen === choice.n;
                let bg = 'rgba(255,255,255,0.04)', border = '1px solid rgba(255,255,255,0.1)', color = 'rgba(255,255,255,0.85)';
                if (state === 'answered') {
                  if (isCorrect)     { bg = 'rgba(34,197,94,0.12)';  border = '1px solid rgba(34,197,94,0.4)';  color = '#4ade80'; }
                  else if (isChosen) { bg = 'rgba(239,68,68,0.12)';  border = '1px solid rgba(239,68,68,0.4)';  color = '#f87171'; }
                }
                return (
                  <button key={choice.n} onClick={() => answer(choice)} disabled={state === 'answered'} style={{
                    width: '100%', background: bg, border, color,
                    padding: '18px 24px', borderRadius: 12, fontSize: 16, fontWeight: 600,
                    cursor: state === 'answered' ? 'default' : 'pointer',
                    textAlign: 'left', transition: 'all 0.2s',
                    display: 'flex', justifyContent: 'space-between', alignItems: 'center'
                  }}
                  onMouseEnter={(e) => { if (state==='playing') e.currentTarget.style.background='rgba(255,255,255,0.09)'; }}
                  onMouseLeave={(e) => { if (state==='playing') e.currentTarget.style.background='rgba(255,255,255,0.04)'; }}>
                    <span>{choice.fr}</span>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <span style={{ fontSize: 18, opacity: 0.7 }}>{choice.ar}</span>
                      {state === 'answered' && isCorrect  && <span>✓</span>}
                      {state === 'answered' && isChosen && !isCorrect && <span>✗</span>}
                    </div>
                  </button>
                );
              })}
            </div>

            {/* ── Feedback + suivant ── */}
            {state === 'answered' && (
              <div style={{ textAlign: 'center', marginTop: 32 }}>
                <p style={{ fontSize: 22, fontWeight: 800, color: correct ? '#4ade80' : '#f87171', marginBottom: 4 }}>
                  {correct ? '✓ Bonne réponse !' : '✗ Mauvaise réponse'}
                </p>
                {!correct && (
                  <p style={{ color: 'rgba(255,255,255,0.45)', fontSize: 14, marginBottom: 12 }}>
                    C'était <strong style={{ color: '#c8a727' }}>{question.surah.fr}</strong> — {question.surah.ar}
                  </p>
                )}
                <button onClick={goNextOrBilan} style={{
                  marginTop: 8, background: 'linear-gradient(135deg,#a8891f,#c4a83a)', border: 'none',
                  color: '#f5edd8', padding: '14px 36px', borderRadius: 12, fontSize: 16,
                  fontWeight: 700, cursor: 'pointer', transition: 'all 0.2s'
                }}
                onMouseEnter={(e) => e.currentTarget.style.transform='scale(1.03)'}
                onMouseLeave={(e) => e.currentTarget.style.transform='scale(1)'}>
                  {sessionCount + 1 >= SESSION_SIZE ? '📊 Voir le bilan' : `Question suivante → (${sessionCount + 1}/${SESSION_SIZE})`}
                </button>
              </div>
            )}
          </>
        )}
      </div>

      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
    </div>
  );
}

/* ─── Quiz Category Page ─── */
function QuizCategoryPage({ catKey, level, navigate }) {
  const QUIZ_SIZE = 10;
  const LEVEL_META = {
    debutant: { label: 'Débutant', icon: '🌱', color: '#4ade80' },
    amateur:  { label: 'Amateur',  icon: '⭐', color: '#60a5fa' },
    avance:   { label: 'Avancé',   icon: '🔥', color: '#fb923c' },
  };
  const lvMeta = LEVEL_META[level] || LEVEL_META.debutant;
  const storageKey = 'quiz_score_' + catKey + '_' + (level || 'debutant');

  const [cat, setCat]           = React.useState(null);
  const [questions, setQs]      = React.useState([]);
  const [current, setCurrent]   = React.useState(0);
  const [chosen, setChosen]     = React.useState(null);
  const [answered, setAnswered] = React.useState(false);
  const [score, setScore]       = React.useState(0);
  const [done, setDone]         = React.useState(false);

  React.useEffect(() => {
    fetch('./questions.json').then(r => r.json()).then(data => {
      const c = data[catKey];
      if (!c) { navigate('quiz'); return; }
      setCat(c);
      const filtered = (c.questions || []).filter(q => q.level === (level || 'debutant'));
      const shuffled = [...filtered].sort(() => Math.random() - 0.5).slice(0, QUIZ_SIZE);
      setQs(shuffled);
    });
  }, [catKey, level]);

  const pick = (idx) => {
    if (answered) return;
    setChosen(idx);
    setAnswered(true);
    if (idx === questions[current].correct) setScore(s => s + 1);
  };

  const next = () => {
    if (current + 1 >= QUIZ_SIZE) {
      const newScore = chosen === questions[current].correct ? score + 1 : score;
      const prev = localStorage.getItem(storageKey);
      const prevData = prev ? JSON.parse(prev) : null;
      if (!prevData || newScore > prevData.correct) {
        localStorage.setItem(storageKey, JSON.stringify({ correct: newScore, total: QUIZ_SIZE }));
      }
      setDone(true);
    } else {
      setCurrent(c => c + 1);
      setChosen(null);
      setAnswered(false);
    }
  };

  if (!cat || questions.length === 0) return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'rgba(255,255,255,0.4)' }}>
      Chargement…
    </div>
  );

  const q = questions[current];
  const isCorrect = (idx) => idx === q.correct;

  if (done) {
    const finalScore = score;
    const pct = Math.round(finalScore / QUIZ_SIZE * 100);
    const medal = pct >= 80 ? '🏆' : pct >= 50 ? '⭐' : '📖';
    const msg = pct >= 80 ? 'Excellent ! Masha Allah !' : pct >= 50 ? 'Bien joué, continue !' : 'Continue à apprendre, tu progresses !';
    return (
      <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
        <div style={{ maxWidth: 480, width: '100%', textAlign: 'center' }}>
          <div style={{ fontSize: 72, marginBottom: 16 }}>{medal}</div>
          <h2 style={{ color: '#c8a727', fontSize: 32, fontWeight: 900, marginBottom: 8 }}>{msg}</h2>
          <p style={{ color: 'rgba(255,255,255,0.5)', fontSize: 16, marginBottom: 6 }}>{cat.title}</p>
          <p style={{ color: lvMeta.color, fontSize: 14, fontWeight: 700, marginBottom: 32 }}>
            {lvMeta.icon} Niveau {lvMeta.label}
          </p>
          <div style={{
            width: 140, height: 140, borderRadius: '50%', margin: '0 auto 32px',
            background: `conic-gradient(${cat.color} ${pct * 3.6}deg, rgba(255,255,255,0.08) 0deg)`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: `0 0 40px ${cat.color}44`
          }}>
            <div style={{
              width: 110, height: 110, borderRadius: '50%', background: '#030e06',
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center'
            }}>
              <span style={{ fontSize: 32, fontWeight: 900, color: cat.color }}>{finalScore}</span>
              <span style={{ fontSize: 13, color: 'rgba(255,255,255,0.35)' }}>sur {QUIZ_SIZE}</span>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 12, justifyContent: 'center', flexWrap: 'wrap' }}>
            <button onClick={() => {
              setCurrent(0); setChosen(null); setAnswered(false); setScore(0); setDone(false);
              const filtered = (cat.questions || []).filter(q => q.level === (level || 'debutant'));
              setQs([...filtered].sort(() => Math.random() - 0.5).slice(0, QUIZ_SIZE));
            }} style={{
              background: 'linear-gradient(135deg,#a8891f,#c4a83a)', border: 'none',
              color: '#f5edd8', padding: '13px 28px', borderRadius: 12,
              fontSize: 15, fontWeight: 700, cursor: 'pointer', fontFamily: 'Plus Jakarta Sans, sans-serif'
            }}>🔄 Rejouer</button>
            <button onClick={() => navigate('quiz')} style={{
              background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)',
              color: 'rgba(255,255,255,0.75)', padding: '13px 28px', borderRadius: 12,
              fontSize: 15, fontWeight: 600, cursor: 'pointer', fontFamily: 'Plus Jakarta Sans, sans-serif'
            }}>← Catégories</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="fade-up" style={{ minHeight: '100vh', padding: '0 0 60px' }}>
      <div style={{ maxWidth: 640, margin: '0 auto', padding: '0 20px' }}>
        <button onClick={() => navigate('quiz')} style={{
          background: 'none', border: 'none', color: 'rgba(255,255,255,0.45)',
          fontSize: 14, cursor: 'pointer', padding: '28px 0 0', display: 'flex', alignItems: 'center', gap: 6
        }}>← Catégories</button>

        <div style={{ textAlign: 'center', padding: '28px 0 20px' }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>{cat.icon}</div>
          <h2 style={{ color: cat.color, fontSize: 24, fontWeight: 800, margin: '0 0 10px' }}>{cat.title}</h2>
          <span style={{
            display: 'inline-block', fontSize: 12, fontWeight: 700, padding: '3px 14px', borderRadius: 20,
            background: `${lvMeta.color}18`, border: `1px solid ${lvMeta.color}44`, color: lvMeta.color
          }}>{lvMeta.icon} {lvMeta.label}</span>
        </div>

        <div style={{ marginBottom: 28 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', color: 'rgba(255,255,255,0.4)', fontSize: 13, marginBottom: 8 }}>
            <span>Question {current + 1} / {QUIZ_SIZE}</span>
            <span style={{ color: '#4ade80' }}>✓ {score} correct{score > 1 ? 's' : ''}</span>
          </div>
          <div style={{ height: 5, borderRadius: 3, background: 'rgba(255,255,255,0.08)', overflow: 'hidden' }}>
            <div style={{
              height: '100%', borderRadius: 3,
              width: ((current + (answered ? 1 : 0)) / QUIZ_SIZE * 100) + '%',
              background: cat.color, transition: 'width 0.4s'
            }} />
          </div>
          <div style={{ display: 'flex', gap: 6, marginTop: 10, flexWrap: 'wrap' }}>
            {Array.from({ length: QUIZ_SIZE }).map((_, i) => (
              <div key={i} style={{
                width: 22, height: 5, borderRadius: 2, flexShrink: 0,
                background: i < current ? cat.color : i === current ? `${cat.color}66` : 'rgba(255,255,255,0.1)',
                transition: 'background 0.3s'
              }} />
            ))}
          </div>
        </div>

        <div style={{
          background: 'rgba(255,255,255,0.03)', border: `1px solid ${cat.color}22`,
          borderRadius: 18, padding: '28px 24px', marginBottom: 24
        }}>
          <p style={{ color: '#fff', fontSize: 'clamp(16px,3.5vw,20px)', fontWeight: 700, lineHeight: 1.5, margin: 0 }}>
            {q.q}
          </p>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {q.choices.map((choice, idx) => {
            let bg = 'rgba(255,255,255,0.04)', border = '1px solid rgba(255,255,255,0.1)', color = 'rgba(255,255,255,0.85)';
            if (answered) {
              if (isCorrect(idx)) { bg = 'rgba(34,197,94,0.12)'; border = '1px solid rgba(34,197,94,0.4)'; color = '#4ade80'; }
              else if (idx === chosen) { bg = 'rgba(239,68,68,0.12)'; border = '1px solid rgba(239,68,68,0.4)'; color = '#f87171'; }
            }
            return (
              <button key={idx} onClick={() => pick(idx)} disabled={answered}
                style={{
                  width: '100%', background: bg, border, color,
                  padding: '16px 22px', borderRadius: 12, fontSize: 15, fontWeight: 600,
                  cursor: answered ? 'default' : 'pointer', textAlign: 'left', transition: 'all 0.2s',
                  display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12,
                  fontFamily: 'Plus Jakarta Sans, sans-serif'
                }}
                onMouseEnter={e => { if (!answered) e.currentTarget.style.background = 'rgba(255,255,255,0.09)'; }}
                onMouseLeave={e => { if (!answered) e.currentTarget.style.background = bg; }}>
                <span style={{ flex: 1 }}>{choice}</span>
                {answered && isCorrect(idx) && <span style={{ fontSize: 18 }}>✓</span>}
                {answered && idx === chosen && !isCorrect(idx) && <span style={{ fontSize: 18 }}>✗</span>}
              </button>
            );
          })}
        </div>

        {answered && (
          <div style={{ marginTop: 28 }}>
            <div style={{
              background: isCorrect(chosen) ? 'rgba(34,197,94,0.07)' : 'rgba(239,68,68,0.07)',
              border: `1px solid ${isCorrect(chosen) ? 'rgba(34,197,94,0.25)' : 'rgba(239,68,68,0.25)'}`,
              borderRadius: 14, padding: '18px 20px', marginBottom: 20
            }}>
              <p style={{ fontSize: 18, fontWeight: 800, color: isCorrect(chosen) ? '#4ade80' : '#f87171', margin: '0 0 8px' }}>
                {isCorrect(chosen) ? '✓ Bonne réponse !' : '✗ Mauvaise réponse'}
              </p>
              <p style={{ color: 'rgba(255,255,255,0.6)', fontSize: 14, lineHeight: 1.6, margin: 0 }}>
                {q.explication}
              </p>
            </div>
            <div style={{ textAlign: 'center' }}>
              <button onClick={next} style={{
                background: 'linear-gradient(135deg,#a8891f,#c4a83a)', border: 'none',
                color: '#f5edd8', padding: '14px 36px', borderRadius: 12,
                fontSize: 16, fontWeight: 700, cursor: 'pointer', transition: 'all 0.2s',
                fontFamily: 'Plus Jakarta Sans, sans-serif'
              }}
              onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.03)'}
              onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}>
                {current + 1 >= QUIZ_SIZE ? '📊 Voir le bilan' : `Question suivante → (${current + 1}/${QUIZ_SIZE})`}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── Canvas text helper ─── */
function wrapCanvasText(ctx, text, maxWidth, font) {
  ctx.font = font;
  var words = text.split(' '), lines = [], cur = '';
  for (var i = 0; i < words.length; i++) {
    var test = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = words[i]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ─── Verse boundary detector (silence-based) ─── */
function detectVerseBoundaries(audioBuffer, verseCount) {
  if (verseCount <= 1) return [0];
  const data = audioBuffer.getChannelData(0);
  const sr = audioBuffer.sampleRate;
  const winSize = Math.floor(sr * 0.05); // 50 ms windows
  const totalWin = Math.floor(data.length / winSize);

  // RMS per window
  const rms = new Float32Array(totalWin);
  for (let w = 0; w < totalWin; w++) {
    let sum = 0;
    const off = w * winSize;
    for (let i = 0; i < winSize; i++) { const s = data[off + i]; sum += s * s; }
    rms[w] = Math.sqrt(sum / winSize);
  }

  // Find silence region centres (RMS < threshold for ≥ 4 consecutive windows = 200ms)
  const threshold = 0.015;
  const minWin = 4;
  const silenceCentres = [];
  let silStart = -1;
  for (let w = 0; w <= totalWin; w++) {
    const quiet = w < totalWin && rms[w] < threshold;
    if (quiet) { if (silStart === -1) silStart = w; }
    else {
      if (silStart !== -1 && (w - silStart) >= minWin) {
        silenceCentres.push(Math.floor((silStart + w) / 2) * winSize / sr);
      }
      silStart = -1;
    }
  }

  // Pick verseCount-1 boundaries closest to even-split targets
  const dur = audioBuffer.duration;
  const boundaries = [0];
  for (let i = 1; i < verseCount; i++) {
    const target = (dur / verseCount) * i;
    let best = target; // fallback: even split
    let bestDist = Infinity;
    for (let j = 0; j < silenceCentres.length; j++) {
      const d = Math.abs(silenceCentres[j] - target);
      if (d < bestDist) { bestDist = d; best = silenceCentres[j]; }
    }
    boundaries.push(best);
  }
  return boundaries; // seconds from start, one per verse
}

        ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
      }
      if (verse) {
        const arSz = Math.round(W * 0.054);

        const frLines = wrapCanvasText(ctx, verse.fr, W - 80, frFont);
        let fy = H / 2 + arTH / 2 + frSz * 2.2;
        frLines.forEach(function(line) { ctx.font = frFont; ctx.fillText(line, W / 2, fy); fy += frSz * 1.55; });
        ctx.restore();
        const refSz = Math.round(W * 0.028);
        ctx.save();
        ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = 'rgba(200,167,39,0.88)'; ctx.shadowBlur = 5; ctx.shadowColor = 'rgba(0,0,0,0.8)';

      }
      animRef.current = requestAnimationFrame(render);
    }
    render();
    return function() { if (animRef.current) cancelAnimationFrame(animRef.current); };
  }, []);

  const getAudioUrl = function(sNum, aNum) {

  };

  const stopPreview = function() {

    stopPreview();
    let stopped = false;

      });

        ...textFetches
      ]);
      if (stopped) return;
      setIsPreviewLoading(false);
      setIsPlaying(true);
      if (mp3Buf) {
        const boundaries = (mp3Timestamps && mp3Timestamps.length === actualCount)
          ? mp3Timestamps

        texts.forEach(function(t, i) {
          const delayMs = boundaries[i] * 1000;

          } else {
            setTimeout(function() {
              if (!stopped) cvDataRef.current = Object.assign({}, cvDataRef.current, { verse: { ar: t.ar, fr: t.fr }, ayahNum: t.vNum, loading: false });
            }, delayMs);
          }
        });
        await new Promise(function(resolve) {
          const src = actx.createBufferSource();
          src.buffer = mp3Buf;
          src.connect(actx.destination);
          src.onended = resolve;
          previewRef.current.stopSrc = function() { try { src.stop(); } catch(e) {} };
          src.start(0);
        });
      }
      if (!stopped) { setIsPlaying(false); }
      actx.close().catch(function(){});
      previewRef.current = null;
      return;
    }

    // Kick off ALL fetches in parallel immediately so next verse loads while current plays
    const pending = Array.from({ length: actualCount }, function(_, i) {
      const vNum = ayahNum + i;
      const textP = fetch('https://api.alquran.cloud/v1/ayah/' + surahNum + ':' + vNum + '/editions/quran-simple,fr.hamidullah')
        .then(function(r) { return r.json(); })
        .then(function(d) { return d.code === 200 ? { ar: d.data[0].text, fr: d.data[1].text } : null; })
        .catch(function() { return null; });
      const bufP = fetch(getAudioUrl(surahNum, vNum))
        .then(function(r) { return r.arrayBuffer(); })
        .then(function(buf) { return actx.decodeAudioData(buf); })
        .catch(function() { return null; });
      return { vNum: vNum, textP: textP, bufP: bufP };
    });

    // Wait for first verse before starting
    const first = pending[0];
    const [firstText, firstBuf] = await Promise.all([first.textP, first.bufP]);

    setIsPreviewLoading(false);
    setIsPlaying(true);
    cvDataRef.current = Object.assign({}, cvDataRef.current, { verse: firstText, ayahNum: first.vNum, loading: false });

    if (firstBuf) {
      await new Promise(function(resolve) {
        const src = actx.createBufferSource();
        src.buffer = firstBuf;
        src.connect(actx.destination);
        src.onended = resolve;
        src.start(0);
      });
    } else {
      await new Promise(function(r) { setTimeout(r, 1500); });
    }

    // Play remaining verses — each awaited independently (fetches already running)
    for (let i = 1; i < pending.length; i++) {
      if (stopped) break;
      const item = pending[i];
      const [text, audioBuf] = await Promise.all([item.textP, item.bufP]);
      if (stopped) break;
      cvDataRef.current = Object.assign({}, cvDataRef.current, { verse: text, ayahNum: item.vNum, loading: false });

        await new Promise(function(resolve) {
          const src = actx.createBufferSource();
          src.buffer = audioBuf;
          src.connect(actx.destination);
          src.onended = resolve;
          src.start(0);
        });
      } else {
        await new Promise(function(r) { setTimeout(r, 1500); });

    actx.close().catch(function(){});

    const textFetches = Array.from({ length: actualCount }, function(_, i) {

      return fetch('https://api.alquran.cloud/v1/ayah/' + surahNum + ':' + vNum + '/editions/quran-simple,fr.hamidullah')
        .then(function(r) { return r.json(); })
        .then(function(d) { return d.code === 200 ? { ar: d.data[0].text, fr: d.data[1].text, vNum: vNum } : { ar: '', fr: '', vNum: vNum }; })
        .catch(function() { return { ar: '', fr: '', vNum: vNum }; });
    });

    const [mp3ArrayBuf, ...texts] = await Promise.all([
      fetch(customMp3.url).then(function(r) { return r.arrayBuffer(); }),
      ...textFetches
    ]);

    const actx = new (window.AudioContext || window.webkitAudioContext)();
    await actx.resume();
    const mp3Buf = await actx.decodeAudioData(mp3ArrayBuf);
    const src = actx.createBufferSource();
    src.buffer = mp3Buf;
    src.connect(actx.destination);

    const startTime = actx.currentTime;
    markingRef.current = { actx, src, startTime, count: actualCount };

    setMarkingTexts(texts);
    setMp3Timestamps([0]); // verse 1 always starts at 0
    setMarkingIndex(1);    // next tap = start of verse 2
    setIsMarking(true);

    src.onended = function() {
      setIsMarking(false);
      markingRef.current = null;
    };
    src.start(0);
  };

  const markNext = function() {
    if (!markingRef.current || !isMarking) return;
    const { actx, startTime, count } = markingRef.current;
    const t = actx.currentTime - startTime;
    setMp3Timestamps(function(prev) { return prev ? [...prev, t] : [0, t]; });
    setMarkingIndex(function(prev) {
      const next = prev + 1;
      if (next >= count) {
        // All verses marked — stop audio
        setTimeout(stopMarkingSession, 300);
      }
      return next;
    });
  };

  const createVideoAuto = async function() {
    if (isCreating) return;
    setIsCreating(true); setProgress(0); setDownloadUrl(null);

    // Create AudioContext SYNCHRONOUSLY within user gesture (before any awaits)
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    actx.resume().catch(function(){});
    const audioDest = actx.createMediaStreamDestination();

    const canvas = canvasRef.current;
    const actualCount = Math.min(verseCount, maxAyah - ayahNum + 1);

    // Fetch all verse texts in parallel
    setStatusMsg('Chargement des versets…');
    const verses = await Promise.all(Array.from({ length: actualCount }, async function(_, i) {
      const vNum = ayahNum + i;
      try {
        const res = await fetch('https://api.alquran.cloud/v1/ayah/' + surahNum + ':' + vNum + '/editions/quran-simple,fr.hamidullah');
        const d = await res.json();
        return d.code === 200 ? { ar: d.data[0].text, fr: d.data[1].text, ayah: vNum } : { ar: '', fr: '', ayah: vNum };
      } catch(e) { return { ar: '', fr: '', ayah: vNum }; }
    }));
    setProgress(25);

    // Setup recorder
    setStatusMsg('Enregistrement…');
    const cvStream = canvas.captureStream(30);
    const tracks = cvStream.getVideoTracks().slice();
    audioDest.stream.getAudioTracks().forEach(function(t) { tracks.push(t); });
    const finalStream = new MediaStream(tracks);
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
    const rec = new MediaRecorder(finalStream, { mimeType: mime });
    chunksRef.current = [];
    rec.ondataavailable = function(ev) { if (ev.data.size > 0) chunksRef.current.push(ev.data); };
    rec.onstop = function() {
      const blob = new Blob(chunksRef.current, { type: 'video/webm' });
      setDownloadUrl(URL.createObjectURL(blob));
      setIsCreating(false); setProgress(0); setStatusMsg('');
      actx.close().catch(function(){});
    };
    recorderRef.current = rec;
    rec.start(100);

    // ── Custom MP3 path ──
    if (customMp3 && customMp3.url) {
      setStatusMsg('Chargement du MP3…');
      try {
        const mp3ArrayBuf = await fetch(customMp3.url).then(function(r) { return r.arrayBuffer(); });
        const mp3Buf = await actx.decodeAudioData(mp3ArrayBuf);
        const boundaries = (mp3Timestamps && mp3Timestamps.length === verses.length)
          ? mp3Timestamps
          : detectVerseBoundaries(mp3Buf, verses.length);
        setProgress(50);
        setStatusMsg('Enregistrement avec votre MP3…');
        // Schedule verse text changes — aligned to detected silence boundaries
        verses.forEach(function(v, i) {
          const delayMs = boundaries[i] * 1000;
          const apply = function() {
            cvDataRef.current = Object.assign({}, cvDataRef.current, { verse: { ar: v.ar, fr: v.fr }, ayahNum: v.ayah });
            setProgress(50 + Math.round((i + 1) / verses.length * 50));
            setStatusMsg('Verset ' + (i + 1) + ' / ' + verses.length + '…');
          };
          if (delayMs < 20) apply(); else setTimeout(apply, delayMs);
        });
        await new Promise(function(resolve) {
          const src = actx.createBufferSource();
          src.buffer = mp3Buf;
          src.connect(audioDest);
          src.connect(actx.destination);
          src.onended = resolve;
          src.start(0);
        });
      } catch(e) { setStatusMsg('Erreur MP3'); }
      rec.stop();
      return;
    }

    // Pre-fetch all audio buffers in parallel (start all downloads immediately)
    setStatusMsg('Préparation de l\'audio…');
    const audioPending = verses.map(function(v) {
      return fetch(getAudioUrl(surahNum, v.ayah))
        .then(function(r) { return r.arrayBuffer(); })
        .then(function(buf) { return actx.decodeAudioData(buf); })
        .catch(function() { return null; });
    });

    // Play each verse seamlessly — audio already loading/loaded
    for (let i = 0; i < verses.length; i++) {
      const v = verses[i];
      cvDataRef.current = Object.assign({}, cvDataRef.current, { verse: { ar: v.ar, fr: v.fr }, ayahNum: v.ayah });
      setStatusMsg('Verset ' + (i + 1) + ' / ' + verses.length + '…');
      const audioBuf = await audioPending[i];
      if (audioBuf) {
        await new Promise(function(resolve) {
          const src = actx.createBufferSource();
          src.buffer = audioBuf;
          src.connect(audioDest);
          src.connect(actx.destination);
          src.onended = resolve;
          src.start(0);
        });
      }
      setProgress(25 + Math.round((i + 1) / verses.length * 75));
    }
    rec.stop();
  };

  const selStyle = { width: '100%', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.14)', borderRadius: 10, color: '#fff', padding: '10px 14px', fontSize: 14, cursor: 'pointer', outline: 'none', fontFamily: 'Plus Jakarta Sans,sans-serif', WebkitAppearance: 'none', appearance: 'none' };
  const panelStyle = { background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 16, padding: 20 };
  const secLabel = { color: 'rgba(255,255,255,0.42)', fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', margin: '0 0 14px' };
  const fieldLabel = { color: 'rgba(255,255,255,0.36)', fontSize: 12, display: 'block', marginBottom: 6 };
  const optBtn = function(active) { return { background: active ? 'rgba(200,167,39,0.14)' : 'rgba(255,255,255,0.03)', border: active ? '1px solid rgba(200,167,39,0.38)' : '1px solid rgba(255,255,255,0.08)', borderRadius: 10, padding: '9px 14px', cursor: 'pointer', color: active ? '#c8a727' : 'rgba(255,255,255,0.65)', fontSize: 13, fontWeight: 600, textAlign: 'left', transition: 'all 0.15s', fontFamily: 'Plus Jakarta Sans,sans-serif' }; };
  const smallBtn = { background: 'rgba(255,255,255,0.07)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 8, color: '#fff', padding: '9px 13px', cursor: 'pointer', fontSize: 15, fontFamily: 'Plus Jakarta Sans,sans-serif' };

  return (
    <div className="fade-up" style={{ minHeight: '100vh', padding: '0 0 80px' }}>
      <button onClick={() => navigate('home')} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.45)', fontSize: 14, cursor: 'pointer', padding: '28px 20px 0', display: 'flex', alignItems: 'center', gap: 6 }}>← Retour</button>

      <div style={{ textAlign: 'center', padding: '20px 20px 36px' }}>
        <div style={{ fontSize: 36, marginBottom: 10 }}>🎬</div>
        <h1 style={{ fontSize: 'clamp(28px,5vw,44px)', fontWeight: 900, color: '#c8a727', margin: '0 0 10px', textShadow: '0 2px 32px rgba(200,167,39,0.35)' }}>Studio Vidéo</h1>
        <p style={{ color: 'rgba(255,255,255,0.4)', fontSize: 15, margin: 0 }}>Crée tes vidéos de récitation — prêtes pour TikTok & Instagram</p>
      </div>

      <div className="studio-grid" style={{ display: 'grid', gap: 28, padding: '0 20px', maxWidth: 1080, margin: '0 auto' }}>

        {/* Config Left */}
        <div className="studio-config-left" style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>

          {/* Sourate + Verset + Nombre */}
          <div style={panelStyle}>
            <p style={secLabel}>Sourate & Versets</p>
            <label style={fieldLabel}>Sourate</label>
            <div style={{ position: 'relative', marginBottom: 14 }}>
              <select value={surahNum} onChange={e => setSurahNum(Number(e.target.value))} style={selStyle}>

            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
              <input type="number" min={1} max={maxAyah} value={ayahNum}
                onChange={e => setAyahNum(Math.min(maxAyah, Math.max(1, Number(e.target.value))))}

              <button onClick={() => setAyahNum(a => Math.min(maxAyah, a + 1))} style={smallBtn}>+</button>

            {isMarking && markingTexts.length > 0 && (

                  {markingTexts.map(function(_, i) {

                      <div key={i} style={{

                        transition: 'all 0.25s',

                </div>
                <p style={{ color: 'rgba(255,255,255,0.4)', fontSize: 11, textAlign: 'center', margin: '0 0 4px', textShadow: 'none' }}>

                <button onClick={stopMarkingSession} style={{ width: '100%', marginTop: 8, background: 'transparent', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 10, color: 'rgba(255,255,255,0.3)', fontSize: 12, padding: '8px 0', cursor: 'pointer', fontFamily: 'Plus Jakarta Sans,sans-serif' }}>

}


/* ─── App ─── */
function App() {
  const [page, setPage] = React.useState(function() {
    const h = window.location.hash.slice(1);
    return h || 'home';
  });

  // Write page to hash so refresh restores it
  React.useEffect(function() {
    window.location.hash = page === 'home' ? '' : page;
  }, [page]);

  // Handle browser back/forward
  React.useEffect(function() {
    function onHashChange() {
      const h = window.location.hash.slice(1);
      setPage(h || 'home');
    }
    window.addEventListener('hashchange', onHashChange);
    return function() { window.removeEventListener('hashchange', onHashChange); };
  }, []);

  useEffect(() => {
    // Reveal observer
    const revealObs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          revealObs.unobserve(e.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal, .reveal-stagger').forEach((el) => revealObs.observe(el));

    // Counter observer
    const counterObs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        const el = e.target;
        const target = el.dataset.target;
        const isFloat = target.includes('.');
        const suffix = el.dataset.suffix || '';
        const prefix = el.dataset.prefix || '';
        const numTarget = parseFloat(target.replace(',', '.'));
        const duration = 1600;
        const start = performance.now();
        const animate = (now) => {
          const progress = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const value = numTarget * eased;
          if (isFloat) {
            el.textContent = prefix + value.toFixed(1).replace('.', ',') + suffix;
          } else {
            el.textContent = prefix + Math.round(value).toLocaleString('fr') + suffix;
          }
          if (progress < 1) requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
        counterObs.unobserve(el);
      });
    }, { threshold: 0.5 });

    document.querySelectorAll('[data-counter]').forEach((el) => counterObs.observe(el));

    return () => {revealObs.disconnect();counterObs.disconnect();};
  }, []);

  if (page === 'blind-test') return <BlindTestPage navigate={setPage} />;
  if (page === 'quiz') return <QuizPage navigate={setPage} />;
  if (page.startsWith('quiz-')) {
    const rest = page.slice(5);
    const levels = ['debutant','amateur','avance'];
    const lv = levels.find(l => rest.endsWith('-' + l));
    if (lv) {
      const ck = rest.slice(0, rest.length - lv.length - 1);
      return <QuizCategoryPage catKey={ck} level={lv} navigate={setPage} />;
    }
    return <QuizCategoryPage catKey={rest} level="debutant" navigate={setPage} />;
  }
  if (page === 'studio') return <VideoCreatorPage navigate={setPage} />;

  return (
    <>
      <Navbar navigate={setPage} />
      <main>
        <Hero />
        <ReassuranceBanner />
        <StatsBar />
        <FeatureCards navigate={setPage} />
        <ComparisonTable />
        <ParcoursSection />
        <SoftPaywall />
      </main>
      <Footer />
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
